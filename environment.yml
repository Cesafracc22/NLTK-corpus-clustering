# Conda environment for NLTK Corpus Clustering
# Create: conda env create -f environment.yml
# Activate: conda activate nlp-corpus-clustering

name: nlp-corpus-clustering
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - nltk>=3.8
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - gensim>=4.3
  - joblib>=1.3
  - pip
  # Optional: use pip for packages not on conda
  # - pip:
  #   - -r requirements.txt
